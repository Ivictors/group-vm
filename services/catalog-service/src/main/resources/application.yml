spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${CATALOG_JWT_ISSUER_URI}
  datasource:
    url: ${CATALOG_DB_URL:jdbc:postgresql://localhost:5433/catalog}
    username: ${CATALOG_DB_USERNAME:catalog}
    password: ${CATALOG_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8081}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      show-components: never
      group:
        readiness:
          include: readinessState,db
