openapi: 3.1.0
info:
  title: VmGriffes Catalog API
  version: 1.0.0
  description: >-
    Target MVP contract from issue #35. It is not the current implementation.
    Issues #36-#39 implement lifecycle, public reads, authorization, and price
    history. Administrative operations must not be exposed outside local/test
    environments before issue #38 is complete. Overlapping writes to the same
    product are rejected with 409 concurrent_update; after refreshing the
    product, an administrator may retry. The MVP does not require a client
    precondition header. A later sequential write to the same field replaces
    its prior value. Issue #36 implements the server-side version check.
servers:
  - url: /
security:
  - catalogBearer: []
paths:
  /api/v1/admin/products:
    get:
      operationId: listAdminProducts
      summary: List products in any state
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Products ordered by createdAt descending, then id descending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProductPage'
              example:
                items:
                  - id: 22e19353-7501-4c4b-a943-5766bb2d5179
                    sku: CHAIR-01
                    name: Chair
                    price: {currency: BRL, amount: '129.90'}
                    status: DRAFT
                    createdAt: '2026-11-18T12:00:00Z'
                    updatedAt: '2026-11-18T12:00:00Z'
                page: 0
                size: 20
                totalElements: 1
                totalPages: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createProduct
      summary: Create a draft product
      description: >-
        SKU is trimmed, immutable, and unique ignoring case across all states.
        The validated token subject supplies the actor for the initial price
        record once issue #39 implements the audit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
            example:
              sku: CHAIR-01
              name: Chair
              description: Wooden chair
              price: {currency: BRL, amount: '129.90'}
              weightGrams: 4500
              lengthCm: 55
              widthCm: 50
              heightCm: 90
      responses:
        '201':
          description: Draft product created
          headers:
            Location:
              description: Relative URI of the administrative product resource
              schema: {type: string, format: uri-reference}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProduct'
              example:
                id: 22e19353-7501-4c4b-a943-5766bb2d5179
                sku: CHAIR-01
                name: Chair
                description: Wooden chair
                price: {currency: BRL, amount: '129.90'}
                weightGrams: 4500
                lengthCm: 55
                widthCm: 50
                heightCm: 90
                status: DRAFT
                createdAt: '2026-11-18T12:00:00Z'
                updatedAt: '2026-11-18T12:00:00Z'
                priceHistory:
                  - occurredAt: '2026-11-18T12:00:00Z'
                    actor: operator-subject
                    newAmount: '129.90'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/DuplicateSkuConflict'
  /api/v1/admin/products/{productId}:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    get:
      operationId: getAdminProduct
      summary: Read a product in any state, including its available price history
      description: >-
        Legacy products without shipping data remain visible to administrators.
        Missing shipping fields are omitted until an administrator supplies
        verified values. Such a draft cannot be activated.
      responses:
        '200':
          description: Product found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProduct'
              examples:
                complete:
                  value:
                    id: 22e19353-7501-4c4b-a943-5766bb2d5179
                    sku: CHAIR-01
                    name: Chair
                    description: Wooden chair
                    price: {currency: BRL, amount: '129.90'}
                    weightGrams: 4500
                    lengthCm: 55
                    widthCm: 50
                    heightCm: 90
                    status: ACTIVE
                    createdAt: '2026-11-18T12:00:00Z'
                    updatedAt: '2026-11-18T12:05:00Z'
                    priceHistory:
                      - occurredAt: '2026-11-18T12:00:00Z'
                        actor: operator-subject
                        newAmount: '129.90'
                legacyIncomplete:
                  value:
                    id: 28a10611-02b8-4e76-a331-f70e8547c76e
                    sku: LEGACY-01
                    name: Existing chair
                    price: {currency: BRL, amount: '89.90'}
                    status: DRAFT
                    createdAt: '2026-10-01T12:00:00Z'
                    updatedAt: '2026-10-01T12:00:00Z'
                    priceHistory: []
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateProduct
      summary: Update a draft or active product
      description: >-
        Accepts a nonempty subset of editable fields. SKU cannot be changed.
        A price change adds one history entry; sending the current price does
        not. Archived products cannot be updated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProductRequest'
            example:
              name: Office chair
              price: {currency: BRL, amount: '149.90'}
      responses:
        '200':
          description: Product updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProduct'
              example:
                id: 22e19353-7501-4c4b-a943-5766bb2d5179
                sku: CHAIR-01
                name: Office chair
                description: Wooden chair
                price: {currency: BRL, amount: '149.90'}
                weightGrams: 4500
                lengthCm: 55
                widthCm: 50
                heightCm: 90
                status: DRAFT
                createdAt: '2026-11-18T12:00:00Z'
                updatedAt: '2026-11-18T12:10:00Z'
                priceHistory:
                  - occurredAt: '2026-11-18T12:00:00Z'
                    actor: operator-subject
                    newAmount: '129.90'
                  - occurredAt: '2026-11-18T12:10:00Z'
                    actor: operator-subject
                    oldAmount: '129.90'
                    newAmount: '149.90'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ProductConflict'
  /api/v1/admin/products/{productId}/activate:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    post:
      operationId: activateProduct
      summary: Publish a valid draft product
      description: >-
        All required shipping fields must be present and valid. Legacy drafts
        without those values return 409 invalid_transition until completed.
      responses:
        '200':
          description: Product is active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProduct'
              example:
                id: 22e19353-7501-4c4b-a943-5766bb2d5179
                sku: CHAIR-01
                name: Chair
                price: {currency: BRL, amount: '129.90'}
                weightGrams: 4500
                lengthCm: 55
                widthCm: 50
                heightCm: 90
                status: ACTIVE
                createdAt: '2026-11-18T12:00:00Z'
                updatedAt: '2026-11-18T12:05:00Z'
                priceHistory:
                  - occurredAt: '2026-11-18T12:00:00Z'
                    actor: operator-subject
                    newAmount: '129.90'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ProductConflict'
  /api/v1/admin/products/{productId}/archive:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    post:
      operationId: archiveProduct
      summary: Archive a draft or active product without deleting it
      responses:
        '200':
          description: Product is archived
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProduct'
              example:
                id: 22e19353-7501-4c4b-a943-5766bb2d5179
                sku: CHAIR-01
                name: Chair
                price: {currency: BRL, amount: '129.90'}
                weightGrams: 4500
                lengthCm: 55
                widthCm: 50
                heightCm: 90
                status: ARCHIVED
                createdAt: '2026-11-18T12:00:00Z'
                updatedAt: '2026-11-18T12:15:00Z'
                priceHistory:
                  - occurredAt: '2026-11-18T12:00:00Z'
                    actor: operator-subject
                    newAmount: '129.90'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ProductConflict'
  /api/v1/products:
    get:
      operationId: listPublishedProducts
      summary: List published products
      security: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Only active products, ordered by createdAt descending, then id descending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicProductPage'
              example:
                items:
                  - id: 22e19353-7501-4c4b-a943-5766bb2d5179
                    name: Chair
                    price: {currency: BRL, amount: '129.90'}
                page: 0
                size: 20
                totalElements: 1
                totalPages: 1
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/v1/products/{productId}:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    get:
      operationId: getPublishedProduct
      summary: Read a published product
      description: Unknown, draft, and archived product IDs all return 404.
      security: []
      responses:
        '200':
          description: Published product found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicProduct'
              example:
                id: 22e19353-7501-4c4b-a943-5766bb2d5179
                name: Chair
                description: Wooden chair
                price: {currency: BRL, amount: '129.90'}
                weightGrams: 4500
                lengthCm: 55
                widthCm: 50
                heightCm: 90
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    catalogBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        The service validates signature, issuer, audience catalog-service,
        expiry, and the catalog_admin Keycloak client role in
        resource_access.catalog-service.roles. The validated token subject
        supplies the price-history actor; no actor field is accepted from JSON.
  parameters:
    ProductId:
      name: productId
      in: path
      required: true
      schema: {type: string, format: uuid}
      example: 22e19353-7501-4c4b-a943-5766bb2d5179
    Page:
      name: page
      in: query
      description: Zero-based page index.
      schema: {type: integer, minimum: 0, default: 0}
      example: 0
    Size:
      name: size
      in: query
      description: Number of products per page.
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
      example: 20
  schemas:
    Price:
      type: object
      additionalProperties: false
      required: [currency, amount]
      properties:
        currency: {type: string, const: BRL}
        amount:
          type: string
          maxLength: 20
          pattern: '^(0|[1-9][0-9]*)\.[0-9]{2}$'
          not: {const: '0.00'}
          description: Positive BRL amount with exactly two decimal places.
    CreateProductRequest:
      type: object
      additionalProperties: false
      required: [sku, name, price, weightGrams, lengthCm, widthCm, heightCm]
      properties:
        sku:
          type: string
          maxLength: 80
          pattern: '.*\S.*'
          description: Trimmed on input, immutable, case-insensitively unique across all states.
        name:
          type: string
          maxLength: 160
          pattern: '.*\S.*'
          description: Trimmed on input.
        description: {type: string, maxLength: 2000}
        price: {$ref: '#/components/schemas/Price'}
        weightGrams: {type: integer, minimum: 1}
        lengthCm: {type: number, exclusiveMinimum: 0}
        widthCm: {type: number, exclusiveMinimum: 0}
        heightCm: {type: number, exclusiveMinimum: 0}
    UpdateProductRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      description: SKU is immutable and cannot appear here.
      properties:
        name: {type: string, maxLength: 160, pattern: '.*\S.*'}
        description: {type: string, maxLength: 2000}
        price: {$ref: '#/components/schemas/Price'}
        weightGrams: {type: integer, minimum: 1}
        lengthCm: {type: number, exclusiveMinimum: 0}
        widthCm: {type: number, exclusiveMinimum: 0}
        heightCm: {type: number, exclusiveMinimum: 0}
    AdminProductSummary:
      type: object
      additionalProperties: false
      required: [id, sku, name, price, status, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        sku: {type: string}
        name: {type: string}
        price: {$ref: '#/components/schemas/Price'}
        status: {$ref: '#/components/schemas/ProductStatus'}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    AdminProduct:
      type: object
      additionalProperties: false
      required: [id, sku, name, price, status, createdAt, updatedAt, priceHistory]
      description: >-
        Shipping fields are omitted only when their values are unknown on a
        migrated legacy product. Every newly created product has all four;
        active products must have all four before publication.
      properties:
        id: {type: string, format: uuid}
        sku: {type: string}
        name: {type: string}
        description: {type: string}
        price: {$ref: '#/components/schemas/Price'}
        weightGrams: {type: integer, minimum: 1}
        lengthCm: {type: number, exclusiveMinimum: 0}
        widthCm: {type: number, exclusiveMinimum: 0}
        heightCm: {type: number, exclusiveMinimum: 0}
        status: {$ref: '#/components/schemas/ProductStatus'}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        priceHistory:
          type: array
          description: >-
            Recorded changes ordered oldest first. Pre-audit products can have
            an empty history; no actor or initial event is fabricated for them.
          items: {$ref: '#/components/schemas/PriceRecord'}
    PublicProductSummary:
      type: object
      additionalProperties: false
      required: [id, name, price]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        price: {$ref: '#/components/schemas/Price'}
    PublicProduct:
      type: object
      additionalProperties: false
      required: [id, name, price, weightGrams, lengthCm, widthCm, heightCm]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        description: {type: string}
        price: {$ref: '#/components/schemas/Price'}
        weightGrams: {type: integer, minimum: 1}
        lengthCm: {type: number, exclusiveMinimum: 0}
        widthCm: {type: number, exclusiveMinimum: 0}
        heightCm: {type: number, exclusiveMinimum: 0}
    ProductStatus:
      type: string
      enum: [DRAFT, ACTIVE, ARCHIVED]
    PriceRecord:
      type: object
      additionalProperties: false
      required: [occurredAt, actor, newAmount]
      properties:
        occurredAt: {type: string, format: date-time}
        actor:
          type: string
          minLength: 1
          description: Validated token subject, never a client-supplied actor.
        oldAmount:
          type: string
          description: Omitted for an initial price record.
          maxLength: 20
          pattern: '^(0|[1-9][0-9]*)\.[0-9]{2}$'
          not: {const: '0.00'}
        newAmount:
          type: string
          maxLength: 20
          pattern: '^(0|[1-9][0-9]*)\.[0-9]{2}$'
          not: {const: '0.00'}
    AdminProductPage:
      type: object
      additionalProperties: false
      required: [items, page, size, totalElements, totalPages]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/AdminProductSummary'}}
        page: {type: integer, minimum: 0}
        size: {type: integer, minimum: 1, maximum: 100}
        totalElements: {type: integer, minimum: 0}
        totalPages: {type: integer, minimum: 0}
    PublicProductPage:
      type: object
      additionalProperties: false
      required: [items, page, size, totalElements, totalPages]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/PublicProductSummary'}}
        page: {type: integer, minimum: 0}
        size: {type: integer, minimum: 1, maximum: 100}
        totalElements: {type: integer, minimum: 0}
        totalPages: {type: integer, minimum: 0}
    ProblemDetails:
      type: object
      description: RFC 9457 response without tokens, internal SQL, or sensitive details.
      required: [type, title, status]
      properties:
        type: {type: string, format: uri-reference}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        instance: {type: string, format: uri-reference}
        code: {type: string, description: Stable catalog error code where applicable.}
  responses:
    BadRequest:
      description: Invalid input, page/size, or product ID
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ProblemDetails'}
          example: {type: 'about:blank', title: Bad Request, status: 400}
    Unauthorized:
      description: Missing, invalid, or expired bearer token
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ProblemDetails'}
          example: {type: 'about:blank', title: Unauthorized, status: 401}
    Forbidden:
      description: Authenticated caller lacks catalog_admin
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ProblemDetails'}
          example: {type: 'about:blank', title: Forbidden, status: 403}
    NotFound:
      description: Unknown product, or nonactive product on a public route
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ProblemDetails'}
          example: {type: 'about:blank', title: Not Found, status: 404}
    DuplicateSkuConflict:
      description: The normalized SKU is already reserved, including by an archived product
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ProblemDetails'}
          example:
            type: 'https://github.com/Ivictors/group-vm/issues/35#problem-duplicate-sku'
            title: Duplicate SKU
            status: 409
            code: duplicate_sku
    ProductConflict:
      description: Invalid product transition or concurrent update
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ProblemDetails'}
          examples:
            invalidTransition:
              value:
                type: 'https://github.com/Ivictors/group-vm/issues/35#problem-invalid-transition'
                title: Invalid product transition
                status: 409
                code: invalid_transition
            concurrentUpdate:
              value:
                type: 'https://github.com/Ivictors/group-vm/issues/35#problem-concurrent-update'
                title: Concurrent update
                status: 409
                code: concurrent_update
