name: foundation-ci
on:
  pull_request:
  push:
    branches: [main, develop]
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate foundation files
        shell: bash
        run: |
          set -euo pipefail
          for path in README.md AGENTS.md CONTRIBUTING.md docs/SECURITY.md docs/PRODUCT.md docs/ARCHITECTURE.md docs/DEPLOYMENT_PLAN.md docs/REFERENCES.md docs/MVP_SCOPE.md; do
            test -s "$path"
          done
      - name: Enforce independent Maven services (when added)
        shell: bash
        run: |
          set -euo pipefail
          if [ -d services ]; then
            for dir in services/*; do
              [ -d "$dir" ] || continue
              test -f "$dir/pom.xml" || { echo "Missing $dir/pom.xml"; exit 1; }
            done
          fi
  catalog:
    name: catalog
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: catalog_ci
          POSTGRES_USER: catalog_ci
          POSTGRES_PASSWORD: catalog_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U catalog_ci -d catalog_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CATALOG_DB_URL: jdbc:postgresql://localhost:5432/catalog_ci
      CATALOG_DB_USERNAME: catalog_ci
      CATALOG_DB_PASSWORD: catalog_ci_only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: services/catalog-service/pom.xml
      - name: Unit and HTTP tests
        run: mvn -B -ntp -f services/catalog-service/pom.xml test
      - name: PostgreSQL integration tests on a fresh database
        run: mvn -B -ntp -f services/catalog-service/pom.xml test -Pintegration
      - name: PostgreSQL integration tests on an already migrated database
        run: mvn -B -ntp -f services/catalog-service/pom.xml test -Pintegration
      - name: Build package
        run: mvn -B -ntp -f services/catalog-service/pom.xml package -DskipTests
      - name: Preserve test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-test-reports
          path: services/catalog-service/target/surefire-reports/
          if-no-files-found: warn
          retention-days: 7
