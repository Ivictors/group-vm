name: foundation-ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate foundation files
        shell: bash
        run: |
          set -euo pipefail
          for path in README.md AGENTS.md CONTRIBUTING.md docs/SECURITY.md docs/PRODUCT.md docs/ARCHITECTURE.md docs/DEPLOYMENT_PLAN.md docs/REFERENCES.md; do
            test -s "$path"
          done
      - name: Enforce independent Maven services (when added)
        shell: bash
        run: |
          set -euo pipefail
          if [ -d services ]; then
            for dir in services/*; do
              [ -d "$dir" ] || continue
              test -f "$dir/pom.xml" || { echo "Missing $dir/pom.xml"; exit 1; }
            done
          fi
# TODO (issue F04): add per-service Java build/test, integration tests, dependency,
# secret and image scans. This foundation workflow is NOT a Java quality gate.
